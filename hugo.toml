baseURL = "https://poorants.github.io/"
title = "인생은 펠리컨처럼!"
theme = "hextra"

defaultContentLanguage = "ko"
hasCJKLanguage = true

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

[outputs]
home = ["HTML"]
page = ["HTML"]
section = ["HTML", "RSS"]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[[menu.main]]
identifier = "blog"
name = "블로그"
pageRef = "/blog"
weight = 1

[[menu.main]]
identifier = "about"
name = "소개"
pageRef = "/about"
weight = 2

[[menu.main]]
identifier = "search"
name = "검색"
weight = 3
[menu.main.params]
type = "search"

[[menu.main]]
identifier = "github"
name = "GitHub"
weight = 4
url = "https://github.com/poorants"
[menu.main.params]
icon = "github"

[params.navbar]
displayTitle = true
displayLogo = false

[params.page]
width = "normal"

[params.theme]
default = "system"
displayToggle = true

[params.footer]
enable = true
displayCopyright = true
displayPoweredBy = true
width = "normal"

[params.search]
enable = true
type = "flexsearch"
[params.search.flexsearch]
index = "content"
tokenize = "forward"

[params.blog.list]
displayTags = true
sortBy = "date"
sortOrder = "desc"

[params]
displayUpdatedDate = true
dateFormat = "2006-01-02"
